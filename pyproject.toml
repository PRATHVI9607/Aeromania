[project]
name = "herald"
version = "0.1.0"
description = "HERALD: onboard AI + value-per-byte downlink scheduler for Earth observation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy<2.3",
  "rasterio>=1.3",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "pyproj>=3.6",
  "shapely>=2.0",
  "skyfield>=1.48",
  "requests>=2.31",
  "pillow>=10",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "torch>=2.4",
  "torchvision>=0.19",
  "torchgeo>=0.6",
  "timm>=1.0",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.1",
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/herald"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
